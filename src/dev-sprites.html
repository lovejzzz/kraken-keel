<meta charset="utf-8">
<style>body{margin:0;background:#141c2e}canvas{image-rendering:pixelated;width:1260px;height:720px;display:block}</style>
<canvas id="c" width="420" height="240"></canvas>
<script src="util.js?dev"></script>
<script src="pixel.js?dev"></script>
<script src="sprites.js?dev"></script>
<script>const Cam={bx:(x)=>x,by:(y)=>y}; const S=0.5;</script>
<script>
const cv = document.getElementById('c'), g = cv.getContext('2d');
const types = new URLSearchParams(location.search).get('t') ? new URLSearchParams(location.search).get('t').split(',') : ['captain', 'raider', 'shield', 'berserker', 'thrower', 'draugr', 'draugrShield'];
const poses = [
  { name: 'idle', p: {} }, { name: 'run1', p: { moving: true, run: 0.6 } }, { name: 'run2', p: { moving: true, run: 2.2 } },
  { name: 'wind', p: { weaponA: 2.6 } }, { name: 'strike', p: { weaponA: -1.3, lunge: true } }, { name: 'air', p: { air: true, weaponA: 2.2 } },
  { name: 'brace', p: { crouch: 1, weaponA: 1.1 } }, { name: 'aim', p: { weaponA: -1.6, nock: 1 } },
];
g.fillStyle = '#263a55'; g.fillRect(0, 0, 420, 240);
types.forEach((ty, r) => poses.forEach((ps, c) => {
  const pose = Object.assign({ run: 0, moving: false, air: false, vy: 0, crouch: 0, weaponA: 0.35, hurt: false, swim: false, down: false, rope: false, charge: 0, tell: false, blocking: false, lunge: false, breath: 0 }, ps.p);
  const img = composePuppet(ty, pose);
  const x = 10 + c * 52, y = 36 + r * 38;
  g.drawImage(img, x - 14, y - 38);
}));
quantize(g, 420, 240);
</script>
