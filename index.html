'use strict';
/* Math, noise and input shared by every module. */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const smooth = (t) => t * t * (3 - 2 * t);
const sign = (v) => (v < 0 ? -1 : 1);
const wrapAngle = (a) => Math.atan2(Math.sin(a), Math.cos(a));

function hash1(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function noise1(x) { const i = Math.floor(x), f = x - i; return lerp(hash1(i), hash1(i + 1), smooth(f)); }
function fbm1(x, oct = 4) { let a = 0, amp = 0.5, fr = 1; for (let i = 0; i < oct; i++) { a += amp * noise1(x * fr + i * 17.3); fr *= 2.03; amp *= 0.5; } return a; }
function hash2(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function noise2(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = smooth(x - ix), fy = smooth(y - iy);
  return lerp(lerp(hash2(ix, iy), hash2(ix + 1, iy), fx), lerp(hash2(ix, iy + 1), hash2(ix + 1, iy + 1), fx), fy);
}
function fbm2(x, y, oct = 5) { let a = 0, amp = 0.5, fr = 1; for (let i = 0; i < oct; i++) { a += amp * noise2(x * fr, y * fr); fr *= 2.02; amp *= 0.5; } return a; }

function rgba(r, g, b, a = 1) { return `rgba(${r | 0},${g | 0},${b | 0},${a})`; }
function mixc(c1, c2, t) { return [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)]; }

function offscreen(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0); c.getContext('2d', { willReadFrequently: true }); return c; }

/* Input: keyboard + mouse in world coordinates (set by the camera each frame). */
const Input = {
  keys: new Set(), taps: new Set(), mouse: { sx: 0, sy: 0, x: 0, y: 0, l: false, r: false, lp: false, rp: false, lr: false, rr: false },
  init(canvas) {
    addEventListener('keydown', (e) => {
      const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.key)) e.preventDefault();
      if (!this.keys.has(k)) this.taps.add(k);
      this.keys.add(k);
    });
    addEventListener('keyup', (e) => { const k = e.key.length === 1 ? e.key.toLowerCase() : e.key; this.keys.delete(k); });
    addEventListener('blur', () => { this.keys.clear(); this.mouse.l = this.mouse.r = false; });
    canvas.addEventListener('mousemove', (e) => { const r = canvas.getBoundingClientRect(); this.mouse.sx = e.clientX - r.left; this.mouse.sy = e.clientY - r.top; });
    canvas.addEventListener('mousedown', (e) => {
      const r = canvas.getBoundingClientRect(); this.mouse.sx = e.clientX - r.left; this.mouse.sy = e.clientY - r.top;
      if (e.button === 0) { this.mouse.l = true; this.mouse.lp = true; }
      if (e.button === 2) { this.mouse.r = true; this.mouse.rp = true; }
    });
    addEventListener('mouseup', (e) => {
      if (e.button === 0 && this.mouse.l) { this.mouse.l = false; this.mouse.lr = true; }
      if (e.button === 2 && this.mouse.r) { this.mouse.r = false; this.mouse.rr = true; }
    });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  },
  down(...ks) { return ks.some((k) => this.keys.has(k)); },
  tap(...ks) { return ks.some((k) => this.taps.has(k)); },
  axis() { return (this.down('d', 'ArrowRight') ? 1 : 0) - (this.down('a', 'ArrowLeft') ? 1 : 0); },
  endFrame() { this.taps.clear(); this.mouse.lp = this.mouse.rp = this.mouse.lr = this.mouse.rr = false; },
};

function store(key, val) { try { if (val === undefined) return JSON.parse(localStorage.getItem(key)); localStorage.setItem(key, JSON.stringify(val)); } catch (e) { return null; } }

</script>

  splash(x, amount, width = 24) {

  update(dt) {

  /* far sea between the horizon and the wave profile: flat bands with drifting glints */

  /* near water: one column per buffer pixel, bands by depth, foam on crests */
  drawFront(ctx, flash, glints) {

      const d = hash1(k * 5.1), x = ((hash1(k * 9.3) * W * 2 - t * (6 + d * 14) - this.travel * S * (0.4 + d * 0.5)) % (W + 40) + W + 40) % (W + 40) - 20;

      }
    }
  },
};

/* ---------------- sky ---------------- */
const Sky = {
  clouds: [], cliffs: [], flash: 0, bolt: null, nextBolt: 6, rain: [], moon: { x: 0.74 }, fog: 0, tint: 0, dawn: 0, dawnTarget: 0, boss: false,
  build() {
    const mk = (w, h, seed, dens, tones) => {
      const c = offscreen(w, h), g = c.getContext('2d');
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const u = x / w, v = y / h, n = lerp(fbm2(u * 7 + seed, v * 2.6, 5), fbm2((u - 1) * 7 + seed, v * 2.6, 5), u);
        const shape = smooth(clamp(1 - Math.abs(v - 0.5) * 2.2, 0, 1)), a = (n - (1 - dens)) * 3 * shape;
        const th = BAYER[(y & 3) * 4 + (x & 3)] / 18 + 0.5;
        if (a <= th * 0.5) continue;
        const lit = clamp((1 - v) * 0.8 + (n - 0.55) * 2, 0, 1) + (th - 0.5) * 0.3;
        g.fillStyle = C[tones[lit > 0.66 ? 2 : lit > 0.33 ? 1 : 0]]; g.fillRect(x, y, 1, 1);
      }
      return c;
    };
    this.clouds = [
      { c: mk(480, 70, 3.1, 0.6, ['n3', 'n4', 'n5']), y: -330, par: 0.05, sp: 2 },
      { c: mk(480, 64, 9.7, 0.56, ['n2', 'n3', 'n4']), y: -270, par: 0.1, sp: 4 },
      { c: mk(480, 56, 21.3, 0.52, ['n1', 'n2', 'n3']), y: -215, par: 0.18, sp: 7 },
    ];
    const cl = (seed, rough, heightV) => { const pts = []; for (let i = 0; i < 1200; i++) { const u = i / 1200; pts.push(Math.pow(fbm1(u * rough + seed, 5), 1.6) * heightV * (0.6 + 0.4 * Math.sin(u * TAU * 2 + seed))); } return pts; };
    this.cliffs = [{ pts: cl(4.2, 16, 70), par: 0.1, col: ['n3', 'n4'] }, { pts: cl(12.8, 26, 40), par: 0.22, col: ['n2', 'n3'] }];
    for (let i = 0; i < 360; i++) this.rain.push({ x: Math.random(), y: Math.random(), z: rand(0.3, 1) });
  },
  /* the storm answers the kraken: a volley of bolts */
  surge(G) { [0, 0.22, 0.55].forEach((d, i) => G.timers.push({ t: d, f: () => this.strike(null, i === 1) })); Cam.shake(0.18); },
  strike(x = null, sea = false) {
    const W = Cam.BW, bx = x ?? rand(40, W - 40), pts = [[bx, -4]], branches = [];
    let y = -4; const end = sea ? Cam.by(Sea.height(Cam.viewL() + bx / S)) : Cam.by(rand(-420, -200));
    while (y < end) { const [px] = pts[pts.length - 1]; y += randi(6, 13); pts.push([px + randi(-9, 9), y]); if (Math.random() < 0.22) branches.push(pts.length - 1); }
    const br = branches.map((i) => { const b = [pts[i]]; let [x0, y0] = pts[i]; const dir = pick([-1, 1]); for (let k = 0; k < randi(3, 5); k++) { x0 += dir * randi(3, 9); y0 += randi(4, 9); b.push([x0, y0]); } return b; });
    this.bolt = { pts, br, t: sea ? 0.4 : 0.3 }; this.flash = 1;
    if (sea) { const wx = Cam.viewL() + pts[pts.length - 1][0] / S; FX.splash(wx, 1.6); FX.burst(wx, Sea.height(wx) - 6, { n: 14, angle: -Math.PI / 2, spread: 0.8, speed: 260, size: 3, color: 'b4', color2: 'n7', grav: 300, life: 0.7, kind: 'mist' }); FX.light(wx, Sea.height(wx) - 40, 500, [190, 230, 255], 1.4); Cam.shake(0.08); }
    Sfx.play('thunder', clamp((bx - W / 2) / W * 2, -1, 1), 1);
  },
  update(dt, storm) {
    this.flash = Math.max(0, this.flash - dt * 2.8);
    if (this.bolt) { this.bolt.t -= dt; if (this.bolt.t <= 0) this.bolt = null; }
    this.dawn = damp(this.dawn, this.dawnTarget, 0.45, dt);
    if (storm > 0.45) { this.nextBolt -= dt; if (this.nextBolt <= 0) { this.nextBolt = this.boss ? rand(1.3, 3.6) : rand(4, 11) / storm; if (this.boss && Math.random() < 0.4) this.strike(rand(Cam.BW * 0.15, Cam.BW * 0.85), true); else this.strike(); } }
  },
  drawSky(ctx) {
    const W = Cam.BW, f = this.flash, hz = Math.max(1, Cam.by(-250));
    const g = ctx.createLinearGradient(0, 0, 0, hz), bt = this.tint, dw = this.dawn;
    // night -> the kraken's bruised green-violet sky -> dawn once it is gone
    const stop = (night, boss, dawn, fl) => { const c = mixc(mixc(night, boss, bt), dawn, dw); return rgba(c[0] + f * fl[0], c[1] + f * fl[1], c[2] + f * fl[2]); };
    g.addColorStop(0, stop([8, 11, 24], [18, 6, 24], [34, 38, 78], [80, 90, 110])); g.addColorStop(0.7, stop([22, 33, 55], [44, 18, 46], [150, 96, 112], [90, 100, 110])); g.addColorStop(1, stop([44, 76, 96], [62, 104, 70], [255, 168, 104], [80, 90, 90]));

    if (bt > 0.6 && dw < 0.3) return; // the moon is swallowed by the storm

    const mg = ctx.createRadialGradient(mx, my, 4, mx, my, 70); mg.addColorStop(0, rgba(140, 170, 200, ma ? 0.35 : 0.15)); mg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = mg; ctx.fillRect(mx - 70, my - 70, 140, 140);
    P.disc(ctx, mx, my, 9, C.b3); P.disc(ctx, mx - 2, my - 1, 8, C.b4); P.dot(ctx, mx + 3, my + 2, C.b2, 2); P.dot(ctx, mx - 3, my - 3, C.b3, 2); P.dot(ctx, mx + 1, my - 4, C.b2);
  },
  drawClouds(ctx, t) {
    const f = this.flash;
    for (const L of this.clouds) {
      const y = Cam.by(L.y), w = L.c.width, off = Math.round(((Sea.travel * L.par * S * 0.6 + t * L.sp + Cam.x * L.par * S) % w + w) % w);
      for (let x = -off; x < Cam.BW; x += w) ctx.drawImage(L.c, x, y);
      if (f > 0.2) { ctx.globalAlpha = f * 0.5; ctx.globalCompositeOperation = 'lighter'; for (let x = -off; x < Cam.BW; x += w) ctx.drawImage(L.c, x, y); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; }
    }
  },
  /* dawn after the kraken: a warm sun glow rising over the cliffs */
  drawDawn(ctx) {
    const dw = this.dawn; if (dw < 0.02) return;
    const W = Cam.BW, hz = Cam.by(-250), sx = Math.round(W * 0.3), R = 220;
    ctx.globalCompositeOperation = 'lighter';
    const sg = ctx.createRadialGradient(sx, hz, 2, sx, hz, R); sg.addColorStop(0, rgba(255, 200, 120, 0.8 * dw)); sg.addColorStop(0.35, rgba(200, 110, 70, 0.35 * dw)); sg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = sg; ctx.fillRect(sx - R, hz - R, R * 2, R + 30);
    ctx.globalCompositeOperation = 'source-over';
    P.disc(ctx, sx, hz + 2, Math.round(6 + dw * 5), C.f6); P.disc(ctx, sx, hz + 2, Math.round(4 + dw * 4), C.white);
  },
  drawBolt(ctx) {
    if (!this.bolt) return; const b = this.bolt;
    if (Math.random() < 0.2 && b.t < 0.2) return;
    const path = (p, c, w) => { for (let i = 1; i < p.length; i++) P.line(ctx, p[i - 1][0], p[i - 1][1], p[i][0], p[i][1], c, w); };
    path(b.pts, C.n7, 3); b.br.forEach((p) => path(p, C.n6, 1)); path(b.pts, C.white, 1);
  },
  drawCliffs(ctx) {
    const hz = Cam.by(-250), W = Cam.BW;
    for (const c of this.cliffs) {
      const off = Math.round(Cam.x * c.par * S + Sea.travel * c.par * S * 0.3), n = c.pts.length, f = this.flash > 0.3;
      for (let x = 0; x < W; x++) {
        const i = ((x + off) % n + n) % n, h = Math.round(c.pts[i]), top = hz - h;
        ctx.fillStyle = C[f ? 'n5' : c.col[0]]; ctx.fillRect(x, top, 1, hz - top);
        const sn = c.pts[(i + 1) % n] > c.pts[i] ? 1 : 0;
        ctx.fillStyle = C[f ? 'n8' : c.col[1]]; ctx.fillRect(x, top, 1, 1 + sn);
        if (h > 60 && hash1(i) > 0.4) { ctx.fillStyle = C[f ? 'b4' : 'n6']; ctx.fillRect(x, top, 1, 1); }
      }
    }
    if (this.fog > 0.01) { ctx.fillStyle = `rgba(90,120,120,${0.25 * this.fog})`; ctx.fillRect(0, 0, W, Cam.BH); }

  drawRain(ctx, dt, storm, wind) {
    if (storm < 0.25) return;
    const W = Cam.BW, H = Cam.BH, n = Math.floor(this.rain.length * clamp((storm - 0.25) / 0.75, 0, 1)), f = this.flash > 0.3;
    const dx = Math.round(clamp(wind * 0.004, -2, 2));

      const r = this.rain[i];

      const x = Math.round(r.x * W), y = Math.round(r.y * H), len = 2 + Math.round(r.z * 4);
      ctx.fillStyle = C[f ? 'b4' : r.z > 0.7 ? 'n7' : 'n5'];
      for (let k = 0; k < len; k++) ctx.fillRect(x - Math.round(dx * k / len), y - k, 1, 1);
    }
  },

/* ---------------- particles, lights, floating text ---------------- */
const FX = {
  parts: [], lights: [], texts: [], hitstop: 0, timeScale: 1, slowT: 0, rings: [], slashes: [],
  burst(x, y, o = {}) {
    const n = o.n ?? 10;
    for (let i = 0; i < n; i++) {
      const a = (o.angle ?? -Math.PI / 2) + rand(-1, 1) * (o.spread ?? Math.PI), sp = rand(0.3, 1) * (o.speed ?? 300), life = rand(0.6, 1) * (o.life ?? 0.6);
      this.parts.push({
        x: x + rand(-1, 1) * (o.jit ?? 4), y: y + rand(-1, 1) * (o.jit ?? 4), vx: Math.cos(a) * sp + (o.vx ?? 0), vy: Math.sin(a) * sp + (o.vy ?? 0),
        life, max: life, size: Math.max(1, Math.round(rand(0.6, 1.2) * (o.size ?? 2))), col: o.color ?? 'foam', col2: o.color2, grav: o.grav ?? 900,
        drag: o.drag ?? 1.5, rot: rand(0, TAU), vr: rand(-12, 12), kind: o.kind ?? 'dot', water: o.water ?? true,
      });
    }
  },
  splash(x, power = 1) {
    const y = Sea.height(x);
    Sea.splash(x, 120 * power, 20 + power * 20);
    this.burst(x, y, { n: 12 + power * 14, angle: -Math.PI / 2, spread: 0.7, speed: 240 + power * 260, size: 2, color: 'foam', color2: 't7', grav: 1100, life: 0.9, water: false, kind: 'drop' });
    this.burst(x, y, { n: 6 + power * 6, angle: -Math.PI / 2, spread: 1.5, speed: 120, size: 3, color: 't8', grav: 160, life: 0.6, water: false, kind: 'mist', drag: 3 });
    this.rings.push({ x, r: 4, life: 0.5, max: 0.5 });
    Sfx.play(power > 1.4 ? 'splashBig' : 'splash', clamp((x - Cam.x) / 700, -1, 1), clamp(power * 0.7, 0.3, 1));
  },
  splinters(x, y, n = 12, dir = 0, col = 'w4') { this.burst(x, y, { n, angle: dir - Math.PI / 2, spread: 1.4, speed: 420, size: 2, color: col, color2: 'w2', grav: 1300, life: 1.1, kind: 'splinter' }); },
  sparks(x, y, n = 10, dir = -Math.PI / 2) { this.burst(x, y, { n, angle: dir, spread: 1.2, speed: 520, size: 1, color: 'f5', color2: 'f3', grav: 900, life: 0.3, kind: 'spark' }); },
  impact(x, y, big = false) { this.hitSpark(x, y, 0, big); },
  sparksAnim: [], lines: [],
  hitSpark(x, y, ang, big) { this.sparksAnim.push({ x, y, ang, big, t0: performance.now() }); },
  slashLine(x, y, ang, big) { this.lines.push({ x, y, ang, big, t0: performance.now() }); },
  drawHits(ctx) {
    const now = performance.now();
    for (const s of this.sparksAnim) {
      const f = Math.floor((now - s.t0) / 34), bx = Cam.bx(s.x), by = Cam.by(s.y), B = s.big ? 1.15 : 0.8;
      if (f > 5) { s.done = true; continue; }
      const ray = (len0, len1, col, w) => { for (let i = 0; i < 8; i++) { const a = s.ang + i * Math.PI / 4, el = i % 4 === 0 ? 1.6 : i % 2 ? 0.7 : 1; P.line(ctx, bx + Math.cos(a) * len0 * el, by + Math.sin(a) * len0 * el, bx + Math.cos(a) * len1 * el, by + Math.sin(a) * len1 * el, col, w); } };
      if (f === 0) { P.disc(ctx, bx, by, Math.round(4 * B), C.white); P.ring(ctx, bx, by, Math.round(6 * B), C.f6); }
      else if (f === 1) { ray(2, 11 * B, C.white, 1); P.disc(ctx, bx, by, Math.round(3 * B), C.f6); }
      else if (f === 2) { ray(4 * B, 14 * B, C.f6, 1); P.ring(ctx, bx, by, Math.round(7 * B), C.b4); P.disc(ctx, bx, by, 2, C.white); }
      else if (f === 3) { ray(10 * B, 15 * B, C.f4, 1); P.ring(ctx, bx, by, Math.round(10 * B), C.f3); }
      else { for (let i = 0; i < 6; i++) { const a = s.ang + i * 1.05; P.dot(ctx, bx + Math.cos(a) * 15 * B, by + Math.sin(a) * 15 * B, C.f3); } }
    }
    this.sparksAnim = this.sparksAnim.filter((s) => !s.done);
    for (const l of this.lines) {
      const f = Math.floor((now - l.t0) / 34), bx = Cam.bx(l.x), by = Cam.by(l.y), len = (l.big ? 26 : 18) + f * 4;
      if (f > 2) { l.done = true; continue; }
      const c = Math.cos(l.ang), sn = Math.sin(l.ang);
      P.line(ctx, bx - c * len, by - sn * len, bx + c * len, by + sn * len, C[f === 0 ? 'white' : f === 1 ? 'b4' : 'b2'], f === 0 && l.big ? 2 : 1);
    }
    this.lines = this.lines.filter((l) => !l.done);
  },
  light(x, y, r, c, i = 1) { this.lights.push({ x, y, r, c, i }); },
  text(x, y, s, col = 'f5', size = 20, life = 1.1) { this.texts.push({ x, y, s, col, size: Math.round(size * 0.45) + 3, life, max: life, vy: -60 }); },
  stop(t) { this.hitstop = Math.max(this.hitstop, t); },
  slowmo(scale, dur) { this.timeScale = scale; this.slowT = dur; },
  update(dt) {
    if (this.slowT > 0) { this.slowT -= dt / Math.max(this.timeScale, 0.05); if (this.slowT <= 0) this.timeScale = 1; }
    for (const p of this.parts) {
      p.life -= dt; p.vy += p.grav * dt; const k = Math.exp(-p.drag * dt); p.vx *= k; p.vy *= k; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      if (p.water && p.y > Sea.height(p.x) + 2) { p.life = 0; if (p.size > 1 && Math.random() < 0.3) Sea.splash(p.x, 20, 8); }
      if (p.kind === 'ember') p.vx += Math.sin(p.life * 9 + p.rot) * 30 * dt;
    }

    if (this.x < Cam.viewL() + 30 || this.x > Cam.viewR() - 30) { this.throwCd = Math.max(this.throwCd, 1.2); this.tell = 0; this.nock = 0; this.spinHook = 0; return; }
    this.throwCd -= dt; this.nock = 0; this.spinHook = 0;
    const dx = (cap.x - this.x) * this.face, dy = cap.y - 40 - (this.y - 40), aim = Math.atan2(dy, Math.max(20, dx));
    if (this.throwCd < wind) {
      const u = 1 - this.throwCd / wind; this.tell = u > 0.6 ? 1 : 0;
      if (shot === 'arrow') { this.weaponA = aim - 0.25 - HALF_PI; this.nock = u; this.atkLean = -1; }
      else if (shot === 'hook') { this.spinHook = u * 22; this.weaponA = damp(this.weaponA, -2.6 - HALF_PI, 8, dt); }
      else { this.weaponA = damp(this.weaponA, -2.3 - HALF_PI, 10, dt); this.atkLean = -2; if (shot === 'pot' && Math.random() < 0.5) FX.burst(this.x - this.face * 6, this.y - 76, { n: 1, speed: 40, size: 1, color: 'f5', grav: -60, life: 0.2, water: false }); }
    } else { this.weaponA = damp(this.weaponA, shot === 'arrow' ? aim - HALF_PI : 0.5, 4, dt); this.atkLean = damp(this.atkLean || 0, 0, 6, dt); }
    if (this.throwCd <= 0) {
      this.tell = 0; this.atkLean = 2;
      if (shot === 'arrow') { this.throwCd = rand(2.4, 3.2); G.shootArrow(this, cap); }
      else if (shot === 'pot') { this.throwCd = rand(3.4, 4.6); G.throwPot(this, cap); this.weaponA = 0.8 - HALF_PI; }
      else if (shot === 'ice') { this.throwCd = rand(3, 4.2); G.throwIce(this, cap); this.weaponA = 0.8 - HALF_PI; }
      else if (shot === 'hawk') { this.throwCd = rand(5.5, 7.5); G.releaseHawk(this); this.weaponA = -2.6 - HALF_PI; }
      else if (shot === 'hook') { this.throwCd = rand(5.5, 7); this.rope = this.rope || new Rope(this); this.rope.throwAt(G, cap.cx + cap.vx * 0.25, cap.cy, 560); Sfx.play('rope', this.pan()); }
      else { this.throwCd = rand(2.2, 3.4); G.throwAxe(this, cap); this.weaponA = -1.2; }
    }
  }
  onHookCaptain(cap, G) {
    if (cap.brace || cap.dodge > 0 || cap.iframes > 0 || cap.mounted) { FX.text(cap.x, cap.y - 90, '扎稳了！', '#9fe8b0', 20, 0.8); Sfx.play('clang', cap.pan(), 0.6); return; }
    const dir = Math.sign(this.x - cap.x) || 1; cap.onRope = null; cap.atk = null;
    cap.launch(dir * 640, -470); cap.hurt(5, 0, 0, { stun: 0 });
    FX.text(cap.x, cap.y - 90, '被钩住了！', '#ff9a7a', 22, 1); Sfx.play('hook', cap.pan()); FX.stop(0.06); UI.pulse('hurt');
  }
  startBoard(G, from) {
    const ps = G.player, side = Math.sign(ps.x - from.x);
    const yard = { lx: from.yardW() * side, ly: YARD_Y };
    const land = clamp(rand(0.15, 0.85) * ps.walk * -side, -ps.walk + 10, ps.walk - 10);
    this.swingPath = { t: 0, dur: rand(1.0, 1.25), from, yard, p0: { x: this.x, y: this.y }, landLx: land, ship: ps };
    this.ship = null; this.air = true; Sfx.play('rope', this.pan(), 0.7); this.face = side;
  }
  leapTo(G, ps) {
    const s = this.ship, side = Math.sign(s.x - ps.x) || 1;
    const land = side * rand(ps.walk * 0.55, ps.walk - 10);
    this.swingPath = { t: 0, dur: rand(0.55, 0.75), leap: true, p0: { x: this.x, y: this.y }, landLx: land, ship: ps };
    this.ship = null; this.air = true; this.face = -side; Sfx.play('jump', this.pan());
  }
  followSwing(dt, G) {
    const P = this.swingPath; P.t += dt; const k = clamp(P.t / P.dur, 0, 1), s = P.ship;
    const end = s.toWorld(P.landLx, s.deckY(P.landLx));
    let x, y;
    if (P.leap) { x = lerp(P.p0.x, end.x, k); y = lerp(P.p0.y, end.y, k) - Math.sin(k * Math.PI) * 170; }
    else {
      const a = P.from.sunk ? null : P.from.toWorld(P.yard.lx, P.yard.ly);
      if (!a) { this.swingPath = null; this.launch(this.vx, this.vy); return; }
      const c = { x: (P.p0.x + end.x) / 2, y: Math.max(P.p0.y, end.y) + 90 };
      x = (1 - k) * (1 - k) * P.p0.x + 2 * (1 - k) * k * c.x + k * k * end.x; y = (1 - k) * (1 - k) * P.p0.y + 2 * (1 - k) * k * c.y + k * k * end.y - Math.sin(k * Math.PI) * 60;
      P.anchor = a;
    }
    this.vx = (x - this.x) / Math.max(dt, 1e-3); this.vy = (y - this.y) / Math.max(dt, 1e-3); this.x = x; this.y = y;
    this.weaponA = damp(this.weaponA, 2.4, 6, dt); this.spin = 0;
    if (k >= 1) { this.swingPath = null; this.land(s, P.landLx); this.stun = 0.15; }
  }
  drawRope(ctx) { if (this.swingPath && this.swingPath.anchor) ropeLine(ctx, this.x, this.y - 56 * this.scale, this.swingPath.anchor.x, this.swingPath.anchor.y, 0.02); if (this.rope) this.rope.draw(ctx, G.t); }
}

/* ---------------- projectiles ---------------- */
class Projectile {
  constructor(o) { Object.assign(this, { x: 0, y: 0, vx: 0, vy: 0, dmg: 10, team: 'player', kind: 'bolt', life: 3, hitSet: new Set(), grav: 380, spin: 0, a: 0, pierce: 0, dead: false }, o); }
  update(dt, G) {
    this.life -= dt; if (this.life <= 0) this.dead = true;
    if (this.kind === 'pot') this.a += dt * 9;
    this.vy += this.grav * dt; this.vx += WIND.v * (this.kind === 'bolt' ? 90 : 60) * dt;
    const steps = 3;
    for (let s = 0; s < steps && !this.dead; s++) {
      this.x += this.vx * dt / steps; this.y += this.vy * dt / steps; this.a = this.kind === 'axe' ? this.a + dt * 18 / steps : Math.atan2(this.vy, this.vx);
      if (this.team === 'player') G.boltHits(this); else G.enemyShotHits(this);
      if (this.y > Sea.height(this.x) + 4 && !this.dead) { this.dead = true; FX.splash(this.x, 0.35); }
    }
    if (this.kind === 'bolt' && Math.random() < 0.5) FX.burst(this.x, this.y, { n: 1, speed: 10, size: 3, color: 'm4', grav: -20, life: 0.3, kind: 'mist', water: false });
  }
  draw(ctx) {
    const bx = Cam.bx(this.x), by = Cam.by(this.y);
    if (this.kind === 'bolt') {
      const c = Math.cos(this.a), sn = Math.sin(this.a);
      if (this.crit) { P.line(ctx, bx - c * 22, by - sn * 22, bx, by, C.f4, 3); if (Math.random() < 0.7) FX.burst(this.x, this.y, { n: 1, speed: 30, size: 1, color: 'gold', grav: 0, life: 0.25, water: false }); FX.light(this.x, this.y, 70, [255, 210, 110], 0.8); }
      P.line(ctx, bx - c * 16, by - sn * 16, bx, by, C[this.crit ? 'gold' : this.hot ? 'f4' : 'w4'], 1);
      P.line(ctx, bx, by, bx + c * 3, by + sn * 3, C.m4, 2);
      P.dot(ctx, bx - c * 16, by - sn * 16 - 1, C.b3); P.dot(ctx, bx - c * 15, by - sn * 15 + 1, C.b3);
      if (this.hot) P.dot(ctx, bx - c * 8, by - sn * 8, C.f6);
    } else if (this.kind === 'arrow') blitRot(ctx, SPR.arrow, bx, by, Math.atan2(this.vy, this.vx) - HALF_PI, 1, 6);
    else if (this.kind === 'pellet') { const c = Math.cos(this.a), sn = Math.sin(this.a); P.line(ctx, bx - c * 5, by - sn * 5, bx, by, C[this.crit ? 'gold' : 'm4'], 1); P.dot(ctx, bx, by, C[this.fire ? 'f5' : 'b4']); }
    else if (this.kind === 'ice') { P.disc(ctx, bx, by, 4, C.ink); P.disc(ctx, bx, by, 3, C.n8); P.dot(ctx, bx - 1, by - 1, C.white, 2); if (Math.random() < 0.7) FX.burst(this.x, this.y, { n: 1, speed: 20, size: 1, color: 'b4', grav: 0, life: 0.3, water: false }); FX.light(this.x, this.y, 60, [150, 220, 255], 0.7); }
    else if (this.kind === 'pot') { blitRot(ctx, SPR.pot, bx, by, this.a, 3, 4); if (Math.random() < 0.6) FX.burst(this.x, this.y - 6, { n: 1, speed: 20, size: 1, color: 'f5', grav: -40, life: 0.2, water: false }); }
    else blitRot(ctx, SPR.axe, bx, by, this.a, 1, 6);
  }
}

function drawModule(ctx, s, m, t) {

/* Wind blade: a full-charge sweep throws a crescent of air along the deck that cuts through everyone in its path. */
const Waves = {
  list: [],
  spawn(cap, dmg) { const f = cap.face, w = { x: cap.x + f * 40, y: cap.y - 38, f, v: 1100, life: 0.42, max: 0.42, dmg, hit: new Set() }; this.list.push(w); Sfx.play('wave', cap.pan(), 1); return w; },
  update(dt, G) {
    for (const w of this.list) {
      w.life -= dt; w.x += w.f * w.v * dt; w.v *= Math.exp(-2.2 * dt);
      if (Math.random() < 0.8) FX.burst(w.x - w.f * 10, w.y + rand(-24, 24), { n: 1, angle: w.f > 0 ? Math.PI : 0, spread: 0.3, speed: 80, size: 1, color: 'b4', grav: 0, life: 0.25, water: false });
      for (const e of G.enemies) {
        if (e.dead || e.water || w.hit.has(e) || Math.abs(e.cx - w.x) > (w.tornado ? 44 : 26) || Math.abs(e.cy - w.y) > (w.tornado ? 80 : 56)) continue;
        w.hit.add(e); const crit = Math.random() < 0.3, dmg = w.dmg * (crit ? 2 : 1);
        e.hurt(dmg, w.f * (w.tornado ? 520 : 760), w.tornado ? -760 : -420, { stun: 0.7 }); FX.hitSpark(e.cx, e.cy, w.f > 0 ? 0 : Math.PI, true); FX.stop(0.05); Sfx.play('heavy', e.pan(), 0.9);
        if (crit) critFX(e.cx, e.cy - 20, dmg); if (e.hp <= 0) G.kill(e, G.captain);
      }
      for (const tn of G.tentacles) { if (w.hit.has(tn)) continue; const p = tn.hitPoint(w.x, w.y, 30); if (p) { w.hit.add(tn); tn.damage(w.dmg, G); FX.hitSpark(p.x, p.y, 0, true); } }
    }
    this.list = this.list.filter((w) => w.life > 0);
  },
  draw(ctx) {
    for (const w of this.list) {
      const k = w.life / w.max, bx = Cam.bx(w.x), by = Cam.by(w.y), h = Math.round((14 + (1 - k) * 6) * (w.tornado ? 1.5 : 1));
      if (w.tornado) for (let i = 0; i < 14; i++) { const a = G.t * 22 + i * 0.9, r = 4 + i * 1.3; P.dot(ctx, bx + Math.cos(a) * r * 0.6, by - 18 + i * 3 + Math.sin(a) * 2, C[i % 3 === 0 ? 'r4' : i % 3 === 1 ? 'n7' : 'b4'], 2); }
      for (let i = -h; i <= h; i++) {
        const u = i / h, bow = Math.round(Math.sqrt(1 - u * u) * 7) * w.f, th = Math.max(1, Math.round((1 - Math.abs(u)) * 4 * k + 0.5));
        for (let j = 0; j < th; j++) P.dot(ctx, bx + bow - w.f * j, by + i, C[j === 0 ? 'white' : j === 1 ? 'gold' : 'f4']);
        if (k > 0.4 && Math.abs(u) < 0.8 && (i & 1)) P.dot(ctx, bx + bow - w.f * (th + 2), by + i, C.b4);
      }
    }
  },
};

<script>
/* salvage.js */
'use strict';
/* Salvage: crates of ship parts float off wrecked and cleared enemy ships. Swim to them (or jump down) to pick them up.
   Parts buy ballista upgrades (each ballista keeps its own set). Also burning (fire bolts, firepots) lives here. */
sprite('crate', ['wwwwwwwww', 'wWWWWWWWw', 'wWmWWWmWw', 'wWWmWmWWw', 'wWWWmWWWw', 'wWWmWmWWw', 'wWmWWWmWw', 'wwwwwwwww'], { w: 'w1', W: 'w4', m: 'w2' });
sprite('gear', ['..m.m..', '.mmmmm.', 'mmM.Mmm', '.m...m.', 'mmM.Mmm', '.mmmmm.', '..m.m..'], { m: 'm3', M: 'm4' });

const BALLISTA_UPS = {
  arm: { name: '铁弓臂', parts: 3, desc: '伤害 +40%' },
  winch: { name: '绞盘', parts: 3, desc: '装填快 35%' },
  twin: { name: '双矢', parts: 5, desc: '一次射出两支弩箭' },
  fire: { name: '火油箭', parts: 4, desc: '点燃敌人和敌船，烧触手更狠' },
  harp: { name: '鱼叉箭', parts: 4, desc: '射中的人被拽进海里，敌船被拖近' },
};

const Salvage = {
  spawn(x, n, spread = 120) {
    for (let i = 0; i < n; i++) G.crates.push({ x: x + rand(-spread, spread) * 0.4, y: Sea.height(x) - 30, vx: rand(-1, 1) * spread * 1.2, vy: rand(-520, -360), air: true, age: 0, delay: 0.75 + i * 0.14, t: rand(0, 3), taken: false, held: false, parts: Math.random() < 0.3 ? 2 : 1, rot: rand(-0.3, 0.3) });
  },
  update(dt) {
    for (const c of G.crates) {
      c.t += dt;
      if (c.held || c.taken) continue;
      // parts knocked loose are picked up automatically: a short tumble through the air, then into the hold
      c.age = (c.age || 0) + dt; if (c.age > (c.delay ?? 0)) { Salvage.collect(c); continue; }
      if (c.air) { c.vy += 1300 * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.rot += dt * 9 * Math.sign(c.vx || 1); if (c.y > Sea.height(c.x) - 3 && c.vy > 0) { c.air = false; FX.splash(c.x, 0.35); } continue; }
      c.x += (c.vx - Sea.speed * 0.08) * dt; c.vx *= Math.exp(-2 * dt);
      c.y = damp(c.y, Sea.height(c.x) - 3 + Math.sin(c.t * 2.2) * 2, 6, dt); c.rot = Math.sin(c.t * 1.7) * 0.25;
      if (c.t > 32) c.gone = true;
    }
    G.crates = G.crates.filter((c) => !c.gone && !c.taken);
  },
  collect(c) {
    if (c.taken) return; c.taken = true; G.parts += c.parts;
    Sfx.play('coin', 0, 0.8); Sfx.play('build', 0, 0.5); UI.partBurst(c.x, c.y, c.parts);
  },
  /* at the end of a fight the crew fishes out half of what is still floating */
  sweep() {
    const left = G.crates.filter((c) => !c.taken), n = Math.floor(left.reduce((a, c) => a + c.parts, 0) / 2);
    if (n > 0) { G.parts += n; FX.text(G.captain.x, G.captain.y - 110, `船员捞起了 ${n} 个零件`, 'm4', 18, 1.6); }
    G.crates = [];
  },
  draw(ctx, t) {
    for (const c of G.crates) {

class Kraken {

    // drowned boarders climb out of the sea now and then
    this.spawnT -= dt;
    if (this.spawnT <= 0 && G.enemies.filter((e) => !e.dead).length < 3 + this.phase) { this.spawnT = this.phase === 1 ? 14 : 10; G.climbers(this.phase === 3 ? 3 : 2); }
    if (this.ink) { this.ink = Math.min(1, this.ink); }
  }
  /* big head behind the ship: pre-rendered pixel mantle, per-frame eye */
  static head() {
    if (Kraken._head) return Kraken._head;
    const W = 330, H = 250, c = offscreen(W, H), g = c.getContext('2d'), cx = W / 2;
    const topAt = (x) => { const u = (x - cx) / (W / 2); return Math.abs(u) > 1 ? 1e9 : H * 0.04 + Math.pow(Math.abs(u), 1.9) * H * 0.62 + (u > 0 ? u * 14 : 0) + (fbm1(x * 0.05, 3) - 0.5) * 10; };
    for (let x = 0; x < W; x++) {
      const top = Math.round(topAt(x)); if (top > H) continue;
      for (let y = top; y < H; y++) {
        const lx = (x - cx + 60) / W, ly = (y - 30) / H, lit = clamp(1 - Math.hypot(lx, ly) * 1.7, 0, 1) + (fbm2(x * 0.035, y * 0.035, 4) - 0.5) * 0.45;
        const th = BAYER[(y & 3) * 4 + (x & 3)] / 18 + 0.5, v = lit + (th - 0.5) * 0.35;
        let col = v > 0.74 ? 'k5' : v > 0.52 ? 'k4' : v > 0.3 ? 'k3' : v > 0.12 ? 'k2' : 'k1';
        if (y - top < 1) col = 'k6'; else if (y - top < 3) col = 'k5';
        if (fbm2(x * 0.09 + 9, y * 0.09, 3) > 0.7 && y > top + 8) col = hash2(x, y) > 0.55 ? 'b1' : 'k2';
        g.fillStyle = C[col]; g.fillRect(x, y, 1, 1);
      }
      g.fillStyle = C.k0; g.fillRect(x, top - 1, 1, 1);
    }
    // ridges running up the mantle
    for (let i = 0; i < 6; i++) for (let k = 0; k < 80; k++) { const x = Math.round(cx - 110 + i * 44 + Math.sin(k / 80 * 3 + i) * 8 - k * 0.3), y = H - k * 2; if (y > topAt(x) + 6) { g.fillStyle = C[k % 9 < 5 ? 'k4' : 'k2']; g.fillRect(x, y, 1, 2); } }
    Kraken._head = c; return c;
  }
  draw(ctx, t) {
    const e = this.eyePos, r = smooth(this.rise); if (r <= 0.01) return;
    const hd = Kraken.head(), ex = Cam.bx(e.x), ey = Cam.by(e.y), hx = ex - 150, hy = ey - 50;
    ctx.drawImage(hd, hx, hy);
    if (this.flash > 0.3) { ctx.globalAlpha = 0.5; ctx.drawImage(silhouette(hd, C.k6), hx, hy); ctx.globalAlpha = 1; }
    // socket, eye, lids
    P.disc(ctx, ex, ey, 26, C.k0); P.disc(ctx, ex, ey, 24, C.ink);
    const o = this.eye;
    if (o > 0.05) {
      const hh = Math.round(18 * o), look = Math.round(clamp((Cam.x - e.x) * 0.03, -8, 8));
      for (let y = -hh; y <= hh; y++) {
        const w = Math.round(Math.sqrt(Math.max(0, 1 - (y / Math.max(hh, 1)) ** 2)) * 22);
        for (let x = -w; x <= w; x++) {
          const d = Math.hypot(x - look * 0.4, y * 1.3) / 22, th = BAYER[((y + 64) & 3) * 4 + ((x + 64) & 3)] / 18 + 0.5;
          const v = d + (th - 0.5) * 0.18; const col = v < 0.2 ? 'g3' : v < 0.45 ? 'g2' : v < 0.75 ? 'g1' : 't4';
          ctx.fillStyle = C[col]; ctx.fillRect(ex + x, ey + y, 1, 1);
        }
      }
      ctx.fillStyle = C.ink; ctx.fillRect(ex + look - 1, ey - hh + 1, 3, hh * 2 - 1); ctx.fillRect(ex + look, ey - hh, 1, hh * 2 + 1);
      P.dot(ctx, ex - 8, ey - 6, C.white, 2);
    }
    ctx.fillStyle = C.k2; ctx.fillRect(ex - 24, ey - Math.round(18 * Math.max(o, 0.06)) - 2, 48, 2); ctx.fillRect(ex - 24, ey + Math.round(18 * Math.max(o, 0.06)) + 1, 48, 2);
  }
  glow(G) { if (this.eye > 0.1 && !this.dead) { const e = this.eyePos; FX.light(e.x, e.y, 420 * this.eye, [90, 255, 240], 1.1 * this.eye); } }
}

/* The sea chart: a branching voyage, left to right. Each column is a leg; every node is a destination with a known reward.

sprite('n_elite', ['h..........h', 'hh........hh', '.hh.gggg.hh.', '..hgGGGGgh..', '..gGGGGGGg..', '.gGGkGGkGGg.', '.gGGkGGkGGg.', '.gggggggggg.', '..w......w..', '...wwwwww...', '............', '............'], { h: 'b0', g: 'f2', G: 'gold', k: 'ink', w: 'w1' });
sprite('n_wreck', ['......m.....', '.....mm.....', '....m.m.....', '......m.....', '.wwwwwwwww..', '.wWmWWWmWw..', '.wWWmWmWWw..', '.wWWWmWWWw..', '.wWWmWmWWw..', '.wwwwwwwww..', 't.t.t.t.t.t.', '.t.t.t.t.t.t'], { m: 'w1', w: 'w1', W: 'w4', t: 't4' });
sprite('n_harbor', ['.....mm.....', '....m..m....', '.....mm.....', '..mmmmmmmm..', '.....mm.....', '.....mm.....', '.....mm.....', 'm....mm....m', 'mm...mm...mm', '.mm..mm..mm.', '..mmmmmmmm..', '....mmmm....'], { m: 'n3' });
sprite('n_mystery', ['...wwwww....', '..ww...ww...', '.......ww...', '......ww....', '.....ww.....', '.....ww.....', '............', '.....ww.....', '.....ww.....', '............', '.t.t.t.t.t..', 't.t.t.t.t.t.'], { w: 'n2', t: 'n6' });
sprite('n_boss', ['...kkkkkk...', '.kkKKKKKKkk.', 'kKKggggggKKk', 'kKgGGiiGGgKk', 'kKgGGiiGGgKk', 'kKKggggggKKk', '.kkKKKKKKkk.', '..k.kkkk.k..', '.k..k..k..k.', 'k...k..k...k', '...k....k...', '............'], { k: 'k1', K: 'k3', g: 'g1', G: 'g2', i: 'ink' });
sprite('n_ship', ['......m.......', '....rrmbb.....', '....rrmbb.....', '....rrmbb.....', '......m.......', 'h.....m......h', 'hwwwwwwwwwwwwh', '.wWWWWWWWWWWw.', '..wwwwwwwwww..'], { m: 'w1', r: 'r2', b: 'b4', h: 'w2', w: 'w1', W: 'w4' });

const NODE_TYPES = {
  fight: { icon: 'n_fight', name: '战斗', desc: '一场遭遇战。' },
  elite: { icon: 'n_elite', name: '精英', desc: '首领坐镇的长船。难打，奖励丰厚，必掉零件。' },
  wreck: { icon: 'n_wreck', name: '沉船残骸', desc: '不用打仗。捞起漂在海上的零件和银币。' },
  harbor: { icon: 'n_harbor', name: '港口', desc: '免费补船、回满生命，港口商店打八折。' },
  mystery: { icon: 'n_mystery', name: '迷雾', desc: '雾里看不清：可能是宝藏，也可能是埋伏。' },
  boss: { icon: 'n_boss', name: '海妖', desc: '深渊里的那只眼睛。' },
  wyrm: { icon: 'n_wyrm', name: '霜龙', desc: '冰海深处的巨龙。它会缠住整条船。' },
};
const FIGHT_POOL = [[], ['skiffs'], ['rival', 'storm', 'skiffs'], ['storm', 'nest', 'rival'], ['nest', 'ghost', 'storm'], ['ghost', 'nest', 'storm']];
const ELITE_POOL = ['twin', 'berserk'];

const SeaMap = {
  generate(ch = 1) {
    const cfg = CHAPTERS[ch];
    const layers = [], LN = 7;
    layers.push([{ id: 's', layer: 0, type: 'start', y: 0.5 }]);
    for (let l = 1; l < LN - 1; l++) {
      const n = l === 1 ? 1 : randi(2, 3), row = [];
      const types = this.typesFor(l, n);
      for (let i = 0; i < n; i++) row.push({ id: `${l}_${i}`, layer: l, type: types[i], y: (i + 0.5) / n + rand(-0.08, 0.08) });
      layers.push(row);
    }
    layers.push([{ id: 'boss', layer: LN - 1, type: 'boss', y: 0.5 }]);
    // links: each node reaches the one or two nearest nodes of the next leg; every node gets reached
    for (let l = 0; l < LN - 1; l++) {
      const a = layers[l], b = layers[l + 1];
      for (const n of a) { const near = [...b].sort((p, q) => Math.abs(p.y - n.y) - Math.abs(q.y - n.y)); n.next = near.slice(0, b.length > 2 && Math.random() < 0.6 ? 2 : Math.min(2, b.length)).map((x) => x.id); if (a.length === 1) n.next = b.map((x) => x.id); }
      for (const m of b) if (!a.some((n) => n.next.includes(m.id))) { const n = [...a].sort((p, q) => Math.abs(p.y - m.y) - Math.abs(q.y - m.y))[0]; n.next.push(m.id); }
    }
    // what each destination holds
    const used = {};
    for (const row of layers) for (const n of row) {
      const step = n.layer - 1;
      if (n.type === 'fight') { const pool = cfg.pool[n.layer].filter((k) => !used[k]); n.enc = pick(pool.length ? pool : cfg.pool[n.layer]); used[n.enc] = 1; n.reward = { silver: ENC[n.enc].reward + step * 5, parts: 0 }; }
      if (n.type === 'elite') { n.enc = pick(cfg.elite); n.reward = { silver: Math.round(ENC[n.enc].reward * 1.4 + step * 5), parts: 3 }; }
      if (n.type === 'wreck') n.reward = { silver: 15 + step * 5, parts: randi(3, 5) };
      if (n.type === 'harbor') n.reward = { heal: true };
      if (n.type === 'mystery') n.reward = { unknown: true };
      if (n.type === 'boss') { n.enc = cfg.boss; n.reward = {}; }
    }
    return { ch, layers, at: 's', nodes: Object.fromEntries(layers.flat().map((n) => [n.id, n])) };
  },
  typesFor(l, n) {
    const bag = l === 1 ? ['fight'] : l === 2 ? ['fight', 'mystery', 'wreck'] : l === 3 ? ['fight', 'harbor', 'elite'] : l === 4 ? ['fight', 'elite', 'mystery'] : ['harbor', 'fight', 'elite'];
    const out = []; for (let i = 0; i < n; i++) out.push(bag[i % bag.length]);
    for (let i = out.length - 1; i > 0; i--) { const j = randi(0, i); [out[i], out[j]] = [out[j], out[i]]; }
    return out;
  },
  /* screen placement of a node inside the chart rectangle */
  pos(n, R) { const LN = G.map.layers.length; return { x: Math.round(R.x + 26 + (n.layer / (LN - 1)) * (R.w - 52)), y: Math.round(R.y + 30 + n.y * (R.h - 64)) }; },
  available() { const cur = G.map.nodes[G.map.at]; return cur.next.map((id) => G.map.nodes[id]); },
  /* what happens on arrival */
  enter(n) {
    G.map.at = n.id; n.visited = true; G.step = (G.chapter - 1) * 6 + Math.max(0, n.layer - 1); G.node = n;
    if (n.type === 'fight' || n.type === 'elite' || n.type === 'boss') { UI.screen = null; G.startEncounter(n.enc); return; }
    if (n.type === 'wreck') return this.event('沉船残骸', '一条沉船的残骸在浪里打转。船员跳下去，捞起了零件和银币。', () => this.pay(n.reward), n.reward);
    if (n.type === 'harbor') return this.event('港口', '峡湾里的小港口。木匠补好了船，你也喝上了热汤。港口商店打八折。', () => { const ps = G.player, cap = G.captain; ps.hull = ps.hullMax; ps.breaches = []; cap.hp = cap.max; G.discount = 0.8; G.openRefit(true); }, { heal: true }, true);
    if (n.type === 'mystery') {
      const r = Math.random();
      if (r < 0.45) { const rw = { silver: 30 + G.step * 8, parts: randi(2, 4) }; return this.event('迷雾', '雾散开时，你们撞上了一条被遗弃的货船，舱里还有东西。', () => this.pay(rw), rw); }
      if (r < 0.75) return this.event('迷雾', '是埋伏！小艇从雾里冲了出来。', () => { n.enc = 'skiffs'; n.reward = { silver: 40 + G.step * 5, parts: 1 }; UI.screen = null; G.startEncounter('skiffs'); }, null, false, true);
      return this.event('迷雾', '雾里传来歌声。船员们说那是好兆头：船长的生命上限 +20。', () => { G.captain.max += 20; G.captain.hp = G.captain.max; }, { heal: true });
    }
  },
  pay(rw) { const cap = G.captain; if (rw.silver) { G.silver += rw.silver; Coins.burst(cap.x, cap.y - 160, rw.silver, 0.7); } if (rw.parts) { G.parts += rw.parts; UI.partBurst(cap.x, cap.y - 120, rw.parts); } },
  event(title, body, fn, reward, toRefit = false, danger = false) { UI.event = { title, body, fn, reward, toRefit, danger }; UI.screen = 'event'; Sfx.play(danger ? 'horn' : 'coin', 0, 0.7); },
};

        if (!this.scales.some((q) => q.hp > 0)) { this.scales = []; this.coilT = 0; this.bite = { lx: 0 }; this.go('stunned'); FX.text(G.player.x, G.player.y - 200, '霜龙被震晕了！', '#ffd84a', 24, 1.6); Sfx.play('roar', 0, 1); Cam.shake(0.4); }
        return true;
      }
    }
    if (Math.hypot(x - this.hx, y - this.hy) < 52) {
      const k = this.exposed ? 1.6 : 0.35; this.chip(dmg * k, G); this.flash = 1;
      if (!this.exposed && src === 'cap' && this.hitCd <= 0) { this.hitCd = 1.2; FX.text(this.hx, this.hy - 60, '鳞甲太硬', '#9ab0c0', 16, 0.8); Sfx.play('clang', 0, 0.6); }
      else FX.text(this.hx + rand(-20, 20), this.hy - 50, `${Math.round(dmg * k)}`, this.exposed ? '#ffd84a' : '#bfe8ff', this.exposed ? 22 : 16, 0.7);
      return true;
    }
    return false;
  }
  chip(d, G) {
    if (this.dying) return; this.hp -= d;
    if (this.hp <= 0) { this.hp = 0; this.dying = 0.001; this.scales = []; this.marks = []; this.zone = null; FX.slowmo(0.25, 1.2); Cam.shake(0.5); Sfx.play('roar', 0, 1); G.banner('霜龙坠海', '冰海安静了', '#bfe8ff', 3.5); Sky.auroraRed = 0; }
  }
  glow(L) { if (!this.dying) L.push({ x: this.hx, y: this.hy, r: 150, c: [140, 200, 255], i: 0.55 }); if (this.exposed || this.state === 'breath' || this.state === 'breath_tell') L.push({ x: this.hx, y: this.hy, r: 240, c: [150, 220, 255], i: 1 }); for (const s of this.scales) if (s.hp > 0) { const p = this.deckPoint(G, s.lx, s.dy); L.push({ x: p.x, y: p.y, r: 90, c: [110, 255, 230], i: 0.9 }); } }
}

<script>
/* save.js */
'use strict';
/* Voyage saves: the run is written whenever the ship is safe (refit, the sea chart, or between chapters), so closing the page
   loses nothing. Clearing chapter 1 unlocks starting straight from chapter 2. Best clear times are kept too. */
const Save = {
  KEY: 'kk.run',
  get() { const s = store(this.KEY); return s && s.v === 1 ? s : null; },
  clear() { try { localStorage.removeItem(this.KEY); } catch (e) { /* storage may be blocked */ } },
  progress() { return store('kk.progress') || {}; },
  unlock(k) { const p = this.progress(); if (p[k]) return; p[k] = true; store('kk.progress', p); },
  best() { const b = store('kk.best') || {}; return { c1: b.c1 ?? b.time ?? null, c2: b.c2 ?? null }; },
  /* returns true when this is a new record */
  record(ch, time) { const b = this.best(), k = 'c' + ch, rec = b[k] == null || time < b[k]; if (rec) { b[k] = time; store('kk.best', b); } return rec; },
  write(where) {
    if (G.state === 'title' || !G.map || !G.player) return;
    const cap = G.captain, ps = G.player, m = G.map;
    store(this.KEY, {
      v: 1, where, fullRun: !!G.fullRun, chapter: G.chapter, step: G.step, silver: G.silver, parts: G.parts, ups: G.ups, wpn: G.wpn, discount: G.discount || 1, stats: G.stats, bonFull: Bon.full,
      cap: { hp: cap.hp, max: cap.max, dmgMul: cap.dmgMul, critBonus: cap.critBonus || 0, chargeRate: cap.chargeRate || 1, armor: cap.armor || 1, jumpMul: cap.jumpMul || 1 },
      ship: { hull: ps.hull, hullMax: ps.hullMax, slots: ps.slots.map((s) => (s.mod ? { type: s.mod.type, lv: s.mod.lv, hp: s.mod.hp, max: s.mod.max, ups: s.mod.ups || {}, lit: s.mod.lit } : null)) },
      map: { ch: m.ch, at: m.at, layers: m.layers }, time: Date.now(),
    });
    this.lastWrite = G.t;
  },
  load(s) {
    G.newRun(true);
    Object.assign(G, { chapter: s.chapter, step: s.step, silver: s.silver, parts: s.parts, ups: s.ups || {}, wpn: s.wpn || { cur: 'oar', own: { oar: true } }, discount: s.discount || 1, stats: s.stats || G.stats, fullRun: !!s.fullRun });
    Object.assign(G.captain, s.cap);
    const ps = G.player; ps.hull = s.ship.hull; ps.hullMax = s.ship.hullMax;
    ps.slots.forEach((sl, i) => { const d = s.ship.slots[i]; sl.mod = d ? Object.assign(G.makeModule(d.type, sl.lx), d) : null; });
    G.map = { ch: s.map.ch, at: s.map.at, layers: s.map.layers, nodes: Object.fromEntries(s.map.layers.flat().map((n) => [n.id, n])) };
    Sky.setTheme(CHAPTERS[s.chapter].theme); G.makeFloes(); Bon.reset(); Bon.full = s.bonFull ?? 100;
    UI.screen = null; UI.paused = false; FX.timeScale = 1;
    if (s.where === 'ch2') G.startChapter(2);
    else if (s.where === 'map') G.openRoute();
    else G.openRefit(s.where === 'harbor');
  },
  /* a fresh voyage that begins at chapter 2, with a purse to kit the ship out first */
  startAt2() {
    this.clear(); G.newRun(true); G.chapter = 2; G.step = 6; G.map = SeaMap.generate(2); Sky.setTheme('ice'); G.makeFloes(); Bon.reset();
    G.silver = 700; G.parts = 12; UI.screen = null; G.openRefit(false);
    G.banner('第二章 · 冰封北海', '起步资金 700 银、12 个零件：先整备，再起航', '#bfe8ff', 3.2);
  },
  /* in a refit or on the chart, write every couple of seconds so purchases are kept too */
  tick() { if ((G.state === 'refit' || G.state === 'route') && G.t - (this.lastWrite || 0) > 2) this.write(G.state === 'route' ? 'map' : G.refitHarbor ? 'harbor' : 'refit'); },
  /* "chapter 1 · leg 3" for the continue button */
  label(s) { return `第 ${s.chapter} 章 · 第 ${Math.max(1, s.step - (s.chapter - 1) * 6 + 1)} 程`; },
};

<script>
/* touch.js */
'use strict';
/* Touch play: pixel buttons on screen (move, jump, attack/charge, roll, brace, E, Q) that press the same keys and mouse
   buttons the keyboard does; several at once. Attacks aim themselves at the nearest foe. Taps anywhere else act as clicks. */
const Touch = {
  on: false, ptr: new Map(), held: new Set(), btns: [],
  init(cv) {
    try { if (matchMedia('(pointer: coarse)').matches && !matchMedia('(pointer: fine)').matches) this.on = true; } catch (e) { /* old browsers */ }
    cv.style.touchAction = 'none';
    // swallow the emulated mouse events and page gestures a touch would otherwise make
    cv.addEventListener('touchstart', (e) => { e.preventDefault(); }, { passive: false });
    cv.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });
    cv.addEventListener('pointerdown', (e) => { if (e.pointerType !== 'touch') return; this.on = true; this.down(e); });
    cv.addEventListener('pointermove', (e) => { if (e.pointerType === 'touch') this.move(e); });
    const up = (e) => { if (e.pointerType === 'touch') this.up(e); };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  },
  portrait() { return this.on && innerHeight > innerWidth * 1.05; },
  buf(e) { const r = G.cv.getBoundingClientRect(); return { sx: e.clientX - r.left, sy: e.clientY - r.top, x: (e.clientX - r.left) / Cam.k, y: (e.clientY - r.top) / Cam.k }; },
  at(p) { for (const b of this.btns) if (p.x >= b.x - 3 && p.x <= b.x + b.w + 3 && p.y >= b.y - 3 && p.y <= b.y + b.h + 3) return b; return null; },
  down(e) {
    const p = this.buf(e), b = this.at(p);
    if (b) { this.ptr.set(e.pointerId, b.id); this.press(b.id, true); return; }
    // not a control: a click on whatever is under the finger (menus, deck slots, the chart)
    Input.mouse.sx = p.sx; Input.mouse.sy = p.sy;
    const hit = UI.hitAt({ x: p.x, y: p.y });
    if (hit || UI.screen || G.state === 'refit' || G.state === 'title') { Input.mouse.lp = true; Input.mouse.l = true; this.ptr.set(e.pointerId, 'ui'); }
  },
  move(e) {
    const id = this.ptr.get(e.pointerId); if (!id || id === 'ui') return;
    // slide between the two arrows without lifting
    if (id === 'left' || id === 'right') { const b = this.at(this.buf(e)); if (b && (b.id === 'left' || b.id === 'right') && b.id !== id) { this.press(id, false); this.press(b.id, true); this.ptr.set(e.pointerId, b.id); } }
  },
  up(e) {
    const id = this.ptr.get(e.pointerId); this.ptr.delete(e.pointerId); if (!id) return;
    if (id === 'ui') { Input.mouse.l = false; Input.mouse.lr = true; return; }
    this.press(id, false);
  },
  press(id, on) {
    const key = { left: 'a', right: 'd', jump: ' ', roll: 'Shift', brace: 's', use: 'e', swap: 'q' }[id];
    if (on) this.held.add(id); else this.held.delete(id);
    if (id === 'atk') { if (on) { Input.mouse.l = true; Input.mouse.lp = true; } else { Input.mouse.l = false; Input.mouse.lr = true; } return; }
    if (!key) return;
    if (on) { if (!Input.keys.has(key)) Input.taps.add(key); Input.keys.add(key); } else Input.keys.delete(key);
  },
  /* attacks and shots point at the nearest foe in reach; otherwise straight ahead */
  aim(G) {
    const cap = G.captain; let best = null, bd = 1e9;
    const consider = (x, y, pri = 1) => { const d = Math.hypot(x - cap.x, y - cap.y) / pri - (Math.sign(x - cap.x) === cap.face ? 60 : 0); if (d < bd && Math.abs(x - cap.x) < 520) { bd = d; best = { x, y }; } };
    for (const e of G.enemies) if (!e.dead && !e.water) consider(e.cx, e.cy);
    for (const h of G.hawks || []) if (!h.dead) consider(h.x, h.y, 1.2);
    for (const t of G.tentacles) if (t.hittable() && t.pts.length) { const q = t.pts[(t.pts.length * 0.7) | 0]; consider(q.x, q.y, 0.9); }
    if (G.kraken && G.kraken.eye > 0.6) { const q = G.kraken.eyePos; consider(q.x, q.y, 1.3); }
    if (G.boss) { const q = G.boss.targetPoint(); if (q) consider(q.x, q.y, q.pri || 1); }
    const t = best || { x: cap.x + cap.face * 220, y: cap.y - 34 };
    Input.mouse.x = t.x; Input.mouse.y = t.y;
  },
  /* lay the buttons out for this frame and draw them */
  draw(ctx, W, H) {
    this.btns = [];
    if (!this.on) return;
    if (this.portrait()) {
      P.rect(ctx, 0, 0, W, H, 'rgba(4,6,12,0.85)'); TXT.dim(ctx, 0.85);
      text(ctx, '请把设备横过来', W / 2, H / 2 - 14, { size: 16, align: 'center', color: C.b4, bold: true }); text(ctx, '横屏才能看清整条船', W / 2, H / 2 + 8, { size: 10, align: 'center', color: C.b2 });
      return;
    }
    const fight = (G.state === 'fight' || G.state === 'won') && !UI.screen, walk = fight || (G.state === 'refit' && UI.screen === 'refit');
    if (!walk) return;
    const add = (id, x, y, w, h, label, show = true) => { if (show) this.btns.push({ id, x: Math.round(x), y: Math.round(y), w, h, label }); };
    add('left', 8, H - 46, 36, 36, '◀'); add('right', 50, H - 46, 36, 36, '▶');
    if (fight) {
      const own = G.wpn ? ['oar', 'cutlass', 'scatter'].filter((k) => G.wpn.own[k]).length : 1;
      add('atk', W - 54, H - 58, 46, 46, G.captain.weapon === 'scatter' ? '射' : '攻');
      add('jump', W - 100, H - 46, 38, 38, '跳');
      add('roll', W - 54, H - 100, 38, 30, '滚');
      add('brace', W - 138, H - 40, 32, 30, '扎');
      add('use', W - 100, H - 86, 32, 28, 'E', !!G.hint && G.hint.includes('E'));
      add('swap', W - 138, H - 76, 32, 28, 'Q', own > 1);
    }
    for (const b of this.btns) {
      const on = this.held.has(b.id), big = b.id === 'atk';
      ctx.globalAlpha = on ? 0.9 : 0.55;
      P.rect(ctx, b.x, b.y, b.w, b.h, C.ink); P.rect(ctx, b.x + 1, b.y + 1, b.w - 2, b.h - 2, C[on ? (big ? 'r3' : 'w4') : big ? 'r1' : 'n2']); P.rect(ctx, b.x + 1, b.y + 1, b.w - 2, 1, C[on ? 'b3' : 'n4']);
      ctx.globalAlpha = 1;
      if (b.label === '◀' || b.label === '▶') { const d = b.label === '◀' ? -1 : 1, cx = b.x + b.w / 2, cy = b.y + b.h / 2; for (let i = 0; i < 8; i++) P.rect(ctx, cx + d * (4 - i), cy - i * 0.9, 1, Math.round(i * 1.8) + 1, C.b3); }
      else text(ctx, b.label, b.x + b.w / 2, b.y + b.h / 2 - (big ? 8 : 6), { size: big ? 15 : 11, align: 'center', color: C.b4, bold: true });
      if (big && G.captain.charging) { const r = b.w / 2 + 2, k = G.captain.charge; for (let a = 0; a < k * TAU; a += 0.12) P.dot(ctx, b.x + b.w / 2 + Math.sin(a) * r, b.y + b.h / 2 - Math.cos(a) * r, C[k >= 1 ? 'gold' : 'f4']); }
    }
  },
};

  /* a row of icons above the chosen deck slot; costs under them; the hovered one names itself */

  },
  buy(k) {

    if (k === 'whet') cap.critBonus = (cap.critBonus || 0) + 0.06;
    if (k === 'rune') cap.chargeRate = 1.3;
    if (k === 'helm') cap.armor = (cap.armor || 1) * 0.85;
    if (k === 'fish') cap.hp = Math.min(cap.max, cap.hp + 35);
    if (k === 'rope') cap.jumpMul = (cap.jumpMul || 1) + 0.12;
    if (k === 'fur') { cap.max += 40; cap.hp += 40; }
    if (k === 'mead') cap.hp = cap.max;
    if (k === 'repair') { ps.hull = Math.min(ps.hullMax, ps.hull + 80); ps.breaches = []; }
    if (k === 'keel') { ps.hullMax += 80; ps.hull += 80; }
    FX.text(cap.x, cap.y - 90, u.name, 'green', 20);

  },
  drawEnd(ctx, W, H) {

    this.panel(ctx, x, y, w, h, this.won ? 'deep' : 'wood');

    text(ctx, ch1 ? '第一章 完' : ch2 ? '冰海平静了' : '龙骨断了', W / 2, y + 12, { size: 22, align: 'center', color: this.won ? (ch2 ? C.n8 : C.g2) : C.r4, bold: true, outline: true });
    text(ctx, ch1 ? '海妖沉回了海底。北方的冰海里，传来了龙吟……' : ch2 ? '霜龙沉入冰海。Bon 在桅杆上唱起了歌。' : `你撑到了第 ${G.chapter} 章第 ${G.step - (G.chapter - 1) * 6 + 1} 程。`, W / 2, y + 42, { size: 10, align: 'center', color: C.b2 });

    } else this.button(ctx, 'again', W / 2 - 45, y + h - 28, 90, 18, '再来一次', { primary: true, fn: () => { this.screen = null; G.newRun(false); } });
  },
};
function shadeUp(col) { const i = Object.values(C).indexOf(col); const keys = Object.keys(C); const k = keys[i]; if (!k) return col; const m = k.match(/^([a-z]+)(\d)$/); if (!m) return col; const up = C[m[1] + (+m[2] + 1)]; return up || col; }
